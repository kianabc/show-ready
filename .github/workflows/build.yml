name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: { swift-version: "6.1" }
      - run: swift test

  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          swift build
          swift test
      - name: Package app
        run: |
          ./scripts/build-app.sh
          # ditto keeps the executable bit and code signature, which a plain artifact upload loses.
          ditto -c -k --keepParent "build/Showready.app" "build/Showready.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Showready
          path: build/Showready.zip
      - name: Publish test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/Showready.zip \
            --title "Latest test build" --prerelease --target "$GITHUB_SHA" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip, then right-click Showready and choose Open the first time."
